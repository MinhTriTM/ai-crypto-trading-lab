[project]
name = "ai-crypto-trading-lab"
version = "0.1.0"
description = "AI Crypto Trading Lab - Thị trường thật, tiền ảo, sàn mô phỏng"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Crypto Lab"}]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "clickhouse-driver>=0.2",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "torch>=2.2",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "transformers>=4.38",
    "scikit-learn>=1.4",
    "faiss-cpu>=1.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
