training:
  seed: 42
  device: "cuda"  # cuda | cpu
  num_envs: 32
  total_timesteps: 10_000_000
  save_interval: 100_000

algorithm:
  name: "ppo"  # ppo | sac | td3 | evolutionary
  ppo:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
  sac:
    learning_rate: 3.0e-4
    buffer_size: 1_000_000
    batch_size: 256
    gamma: 0.99
    tau: 0.005

experience:
  replay_buffer_size: 1_000_000
  rollout_buffer_size: 2048
  sampler: "uniform"  # uniform | prioritized

curriculum:
  enabled: true
  stages:
    - name: "easy"
      market_regime: "sideways"
      difficulty: 0.3
      timesteps: 1_000_000
    - name: "medium"
      market_regime: "mixed"
      difficulty: 0.6
      timesteps: 3_000_000
    - name: "hard"
      market_regime: "volatile"
      difficulty: 1.0
      timesteps: 6_000_000

distributed:
  enabled: false
  num_workers: 4
  backend: "ray"
